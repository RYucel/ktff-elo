name: Haftalık güncelleme

# Her pazartesi 06:00 UTC = KKTC saatiyle 09:00.
# Hafta sonu maçları pazar akşamı KTFF arşivine işlendiği için pazartesi sabahı güvenli.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:        # gerektiğinde elle tetiklenebilir

concurrency:
  group: haftalik
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # yeni maçları data/ altına commit edebilmek için

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıkları
        run: pip install -r requirements.txt

      - name: KTFF'den yeni sonuçları çek
        run: python src/ktff_cek.py

      - name: Değişiklik var mı?
        id: kontrol
        run: |
          if git diff --quiet -- data/; then
            echo "degisti=false" >> "$GITHUB_OUTPUT"
            echo "Yeni maç yok, pipeline atlanıyor."
          else
            echo "degisti=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      - name: Modeli yeniden kur
        if: steps.kontrol.outputs.degisti == 'true'
        working-directory: src
        run: |
          python build_dataset.py
          python final_model.py
          python analiz.py

      - uses: actions/setup-node@v4
        if: steps.kontrol.outputs.degisti == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Wrangler kur
        if: steps.kontrol.outputs.degisti == 'true'
        run: npm ci

      - name: Siteyi derle ve yayımla
        if: steps.kontrol.outputs.degisti == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python src/site_build.py
          npx wrangler deploy

      - name: Yeni maçları depoya işle
        if: steps.kontrol.outputs.degisti == 'true'
        run: |
          git config user.name  "ktff-elo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ out/
          git commit -m "Haftalık güncelleme: yeni KTFF sonuçları"
          git push
