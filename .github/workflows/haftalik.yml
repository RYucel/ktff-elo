name: Model ve yayın

# Kazıma burada YAPILMAZ: ktff.org'un Cloudflare'i veri merkezi IP'lerine
# yönetilen challenge sunuyor (cf-mitigated: challenge). Yeni sonuçlar yerel
# makinede `guncelle.bat` ile çekilip data/ altına commit edilir; bu iş akışı
# o push'u görünce modeli kurar ve siteyi yayımlar.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıkları
        run: pip install -r requirements.txt

      - name: Modeli kur
        working-directory: src
        run: |
          python build_dataset.py
          python final_model.py
          python analiz.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Wrangler kur
        run: npm ci

      - name: Siteyi derle ve yayımla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python src/site_build.py
          npx wrangler deploy
